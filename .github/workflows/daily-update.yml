name: Update papers and publish

on:
  workflow_dispatch:
    inputs:
      retry_rejected:
        description: 'Manually retry held pilot items; existing successful summaries are kept'
        type: boolean
        default: false
  schedule:
    # 08:17 Asia/Shanghai. GitHub schedules can run late.
    - cron: '17 0 * * *'
  push:
    branches: [main]
    paths:
      - 'dist/**'
      - 'config/**'
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/daily-update.yml'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: neurobrief-update-and-deploy
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test ingestion safeguards
        run: python -m unittest discover -s tests -v
      - name: Collect papers
        run: python scripts/update_papers.py
      - name: Generate or attach the capped Chinese-summary pilot
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: python scripts/summarize_papers.py ${{ inputs.retry_rejected && '--retry-rejected' || '' }}
      - name: Checkpoint summary cache and spending ledger
        if: always()
        run: |
          if [ ! -f data/summary_cache.json ]; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/summary_cache.json
          if ! git diff --cached --quiet; then
            git commit -m "Save Chinese summary cache"
            git push
          fi
      - name: Summarize collection
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          d = json.loads(Path('dist/data.json').read_text())
          s = d['update_summary']
          lines = ['## NeuroBrief daily collection',
                   f"Coverage: {d['initial_coverage_start']} to {d['as_of']}",
                   f"Scan: {d['scan_mode']}; previous-week review through: {d.get('weekly_review_through')}",
                   f"New today (Asia/Shanghai, deduplicated): {s['new_papers']}",
                   f"New this run: {s['new_in_run']}; total: {len(d['papers'])}",
                   f"Latest publication date: {s['latest_publication']}",
                   f"Chinese summaries: {d.get('summary_status', {}).get('ready', 0)} / {d.get('summary_status', {}).get('pilot_limit', 0)} pilot; no bulk backfill"]
          for t in d['topics']:
              lines.append(f"- {t['name']}: {sum(t['id'] in p['topics'] for p in d['papers'])}")
          for q in d['queries']:
              lines.append(f"- {q['topic']} fetched {q['candidate_count']} candidates")
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as f:
              f.write('\n\n'.join(lines) + '\n')
          PY
      - name: Build RSS subscriptions
        run: python scripts/build_feeds.py
      - name: Compress website data
        run: python scripts/build_public_data.py
      - name: Validate website and data
        run: python scripts/check_site.py
      - name: Preserve updated literature archive
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/data.json dist/feed*.xml
          if ! git diff --cached --quiet; then
            git commit -m "Update literature archive"
            git push
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
          retention-days: 1
  deploy:
    needs: update
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
