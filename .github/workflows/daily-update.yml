name: Update papers and publish

on:
  workflow_dispatch:
    inputs:
      retry_rejected:
        description: 'Manually retry held or failed summaries; valid cached summaries are kept'
        type: boolean
        default: false
      collect_now:
        description: 'Explicitly collect now; otherwise publish the saved literature only'
        type: boolean
        default: false
  schedule:
    # Lightweight checks before/around morning compensate for delayed events.
    # The gate permits only one successful collection/day, not before 07:50.
    - cron: '10,25,40,55 3-10 * * *'
      timezone: 'Asia/Shanghai'
  push:
    branches: [main]
    paths:
      - 'dist/**'
      - 'config/**'
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/daily-update.yml'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: neurobrief-update-and-deploy
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
    outputs:
      collect: ${{ steps.decision.outputs.collect }}
      deploy: ${{ steps.decision.outputs.deploy }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          sparse-checkout: |
            scripts/update_gate.py
            config/update_policy.json
            dist/update-status.json
            data/source_cooldown.json
          sparse-checkout-cone-mode: false
      - id: decision
        env:
          NEUROBRIEF_EVENT: ${{ github.event_name }}
        run: python3 scripts/update_gate.py ${{ inputs.collect_now && '--force' || '' }}
  update:
    needs: gate
    if: needs.gate.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          # A queued manual run must start from the latest saved cache.
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test ingestion safeguards
        run: python -m unittest discover -s tests -v
      - name: Collect papers
        if: needs.gate.outputs.collect == 'true'
        run: python scripts/update_papers.py
      - name: Refresh saved classifications and collection status
        run: python scripts/refresh_metadata.py
      - name: Generate or attach automatic Chinese overviews
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          if [ "${{ needs.gate.outputs.collect }}" = "true" ] || [ "${{ inputs.retry_rejected }}" = "true" ]; then
            python scripts/summarize_papers.py --checkpoint-every 200 ${{ inputs.retry_rejected && '--retry-rejected' || '' }}
          else
            python scripts/summarize_papers.py --attach-only
          fi
      - name: Back up summary cache before committing
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: summary-cache-${{ github.run_id }}
          path: |
            data/summary_cache.json
            .local/rejected-*.json
          retention-days: 3
          if-no-files-found: ignore
          include-hidden-files: true
      - name: Checkpoint summary cache and spending ledger
        if: always()
        run: |
          if [ ! -f data/summary_cache.json ]; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/summary_cache.json data/source_cooldown.json
          if ! git diff --cached --quiet; then
            git commit -m "Save Chinese summary cache"
            git pull --rebase --autostash origin main
            git push
          fi
      - name: Summarize collection
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          d = json.loads(Path('dist/data.json').read_text())
          s = d['update_summary']
          lines = ['## NeuroBrief daily collection',
                   f"Coverage: {d['initial_coverage_start']} to {d['as_of']}",
                   f"Scan: {d['scan_mode']}; previous-week review through: {d.get('weekly_review_through')}",
                   f"New today (Asia/Shanghai, deduplicated): {s['new_papers']}",
                   f"New in last successful collection: {s['new_in_run']}; total: {len(d['papers'])}",
                   f"Latest publication date: {s['latest_publication']}",
                   f"Chinese summaries: {d.get('summary_status', {}).get('ready', 0)} / {d.get('summary_status', {}).get('eligible', 0)} available abstracts; no abstract: {d.get('summary_status', {}).get('no_abstract', 0)}"]
          for t in d['topics']:
              lines.append(f"- {t['name']}: {sum(t['id'] in p['topics'] for p in d['papers'])}")
          for q in d['queries']:
              lines.append(f"- {q['topic']} fetched {q['candidate_count']} candidates")
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as f:
              f.write('\n\n'.join(lines) + '\n')
          PY
      - name: Build RSS subscriptions
        run: python scripts/build_feeds.py
      - name: Compress website data
        run: python scripts/build_public_data.py
      - name: Validate website and data
        run: python scripts/check_site.py
      - name: Preserve updated literature archive
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/data.json dist/update-status.json dist/feed*.xml
          if ! git diff --cached --quiet; then
            git commit -m "Update literature archive"
            git pull --rebase --autostash origin main
            git push
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
          retention-days: 1
  deploy:
    needs: update
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
